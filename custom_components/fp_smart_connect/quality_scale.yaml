# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      iot_class is local_push: state changes are pushed over the persistent
      BLE GATT connection via notifications (see
      FpSootherCoordinator._handle_state_change). The coordinator's
      poll_method is only used to reconnect the GATT link when it has
      dropped (needs_poll returns True iff the connection isn't live), not
      to poll device state on a fixed interval.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: exempt
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: |
      Every platform sets PARALLEL_UPDATES = 0. Read-only platforms are fed by
      the coordinator, and fp-soother-lib serializes commands per device under
      its own I/O lock, so a platform-wide limit would only delay writes to
      other soothers.
  reauthentication-flow: exempt
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: exempt
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Manages only a single, static device per config entry
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: exempt
  repair-issues: exempt
  stale-devices:
    status: exempt
    comment: |
      Manages only a single, static device per config entry

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
