name: "Publish release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  github-release:
    needs:
      - ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to find previous release tag.
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre='(a|b|rc|\.dev)[0-9]+$'
          tags="$(git -c versionsort.suffix=.dev -c versionsort.suffix=a -c versionsort.suffix=b -c versionsort.suffix=rc \
            tag -l "v*" --sort=-version:refname --merged "$TAG" | grep -vxF "$TAG" || true)"
          # Notes for a final release span everything since the previous final release.
          if [[ ! "$TAG" =~ $pre ]]; then
            tags="$(grep -Ev "$pre" <<< "$tags" || true)"
          fi
          prev="$(head -n 1 <<< "$tags")"
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ -n "$prev" ]]; then
            args+=(--notes-start-tag "$prev")
          fi
          if [[ "$TAG" =~ $pre ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${args[@]}"
